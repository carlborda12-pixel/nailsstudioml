<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de diseños de Mayra López Nails Studio</title>
<meta name="description" content="Catálogo de diseños de uñas de Mayra López Nails Studio, Posadas, Misiones. Elegí tu diseño y reservá tu turno por WhatsApp.">
<meta name="theme-color" content="#EFE3D6">
<meta property="og:title" content="Catálogo de diseños | Mayra López Nails Studio">
<meta property="og:description" content="Elegí tu diseño y reservá tu turno por WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<!-- Imagen al compartir el link: reemplazá TU-DOMINIO por la dirección del catálogo (ej.: catalogo-mayra-lopez.vercel.app) en las dos líneas -->
<meta property="og:url" content="https://catalogo-mayra-lopez.vercel.app/">
<meta property="og:image" content="https://TU-DOMINIO/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='40 30 540 560'%3E%3Crect x='40' y='30' width='540' height='560' rx='90' fill='%23EFE3D6'/%3E%3Cpath d='M52 44H104V457H357V500H52Z' fill='%238C5E48' transform='translate(62 55) scale(.8)'/%3E%3Cpath d='M117 115H175L342 335L510 115H568V580H515V195L342 412L165 195V362H117Z' fill='%238C5E48' transform='translate(62 55) scale(.8)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@1,500&family=Gloock&family=Great+Vibes&family=Lora:ital@0;1&family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  --desk:#EEDFE3; --desk-2:#E2CBD1; --desk-ink:#4A1426; --desk-muted:#8A6470;
  --paper:#FAF1F3; --paper-2:#F4E6EA; --ink:#3A0D1C; --muted:#8B6873;
  --cherry:#8E1230; --hair:#E8D5DA; --hair2:#CDB1B9;
    --serif:'Gloock', 'Bodoni 72', 'Didot', Georgia, serif;
  --sans:'Albert Sans', 'Helvetica Neue', Arial, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --desk:#22070F; --desk-2:#150308; --desk-ink:#F3D9E0; --desk-muted:#B58C98; }
}
:root[data-theme="dark"]{ --desk:#22070F; --desk-2:#150308; --desk-ink:#F3D9E0; --desk-muted:#B58C98; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 35%, var(--desk) 0%, var(--desk-2) 100%);
  background-color:var(--desk);
  color:var(--desk-ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
.desk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:20px 12px;overflow:hidden}
.stage{width:100%;display:flex;justify-content:center;align-items:center}

/* ---------- Libro ---------- */
.book{
  position:relative;isolation:isolate;
  transform:translateX(var(--shift,0px));
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
}
.book.grab{cursor:grab}
.book.grabbing,.book.grabbing *{cursor:grabbing !important}
.stack{
  position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:0;
  background:repeating-linear-gradient(90deg,#F7ECEF 0 1px,#D9C1C8 1px 2px);
  box-shadow:0 36px 60px -26px rgba(40,4,16,.6), 0 4px 12px rgba(40,4,16,.16);
  border-radius:0 3px 3px 0;
  transition:transform .3s, opacity .3s;
}
.stack-r{left:50%;transform:translate(var(--tr,0px), calc(var(--tr,0px) * .45))}
.stack-l{left:0;border-radius:3px 0 0 3px;transform:translate(calc(var(--tl,0px) * -1), calc(var(--tl,0px) * .45))}
.single .stack-r{left:0}
.single .stack-l{display:none}
.book.at-start .stack-l, .book.at-end .stack-r{opacity:0}

.ribbon{
  position:absolute;left:calc(50% + 14px);top:calc(100% - 8px);width:11px;height:40px;z-index:0;
  background:linear-gradient(90deg,#5E0920,#A8203F 45%,#6E0B26);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
  transform:rotate(5deg);transform-origin:top center;
  opacity:0;transition:opacity .4s;
}
.book.open .ribbon{opacity:1}
.single .ribbon{display:none}

/* Páginas y hoja que se dobla */
.page{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);transform-origin:0 0;overflow:hidden;z-index:1}
.page.empty{display:none}
.page.flat{z-index:3;pointer-events:none}
.flap{
  position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);transform-origin:0 0;
  z-index:4;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 2px 9px rgba(50,6,20,.3));
}
.flap>.page{transform:none !important}
.shade{position:absolute;left:0;top:0;z-index:5;pointer-events:none;overflow:visible;display:none}

.paper{background:linear-gradient(180deg,var(--paper),var(--paper-2))}
.page.paper::before{content:"";position:absolute;top:0;bottom:0;width:13%;pointer-events:none;z-index:4}
.page.paper.R::before{left:0;background:linear-gradient(90deg,rgba(90,28,48,.17),rgba(90,28,48,0))}
.page.paper.L::before{right:0;background:linear-gradient(270deg,rgba(90,28,48,.17),rgba(90,28,48,0))}
.page.R{border-radius:0 3px 3px 0}
.page.L{border-radius:3px 0 0 3px}
.verso{background:linear-gradient(90deg,#E9D4DA,#F3E5E9 14%,#EFDDE2)}

/* ---------- Tapa (identidad LM) ---------- */
/* Tapas: foto beige con flores secas y sombras de hojas (la contratapa la usa espejada) */
.cover{background:#EFE3D6;color:#4E3426}
.cover-bg{position:absolute;inset:0;background:url(img/portada.webp) center 40%/cover no-repeat}
.back-bg{transform:scaleX(-1)}
.page.cover.R{border-radius:0 4px 4px 0}
.page.cover.L{border-radius:4px 0 0 4px}
.page.cover::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2}
.page.cover.R::before{background:linear-gradient(90deg,rgba(80,50,30,.24),rgba(80,50,30,0) 4%,rgba(255,255,255,.35) 5%,rgba(255,255,255,0) 7.5%)}
.page.cover.L::before{background:linear-gradient(270deg,rgba(80,50,30,.24),rgba(80,50,30,0) 4%,rgba(255,255,255,.35) 5%,rgba(255,255,255,0) 7.5%)}
.ghost{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Contenido en la zona clara del centro de la foto */
.cover-inner{position:absolute;inset:0;padding:10% 14%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:22%}
.logo{width:3.9em;height:auto;display:block;color:#8C5E48}
.brand{margin:1.6em 0 0;font-family:'Poppins',var(--sans);font-weight:500;font-size:.8em;letter-spacing:.32em;padding-left:.32em;line-height:1;text-transform:uppercase;color:#4E3426}
.tagline{margin:1em auto 0;font-family:'Cormorant Garamond','Lora',Georgia,serif;font-style:italic;font-weight:500;font-size:1.2em;line-height:1.35;color:#6B4A3A;max-width:14em;text-wrap:balance}
.cover-rule{width:2.6em;height:1px;background:#B08A72;margin:1.3em auto 0}
.back-inner{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding-bottom:12%}
.back-inner .logo{width:4.4em;margin:0 auto}
.back-inner .brand{margin-top:1.7em}
.back-inner .city{font-family:'Cormorant Garamond','Lora',Georgia,serif;font-style:italic;font-size:1.05em;color:#6B4A3A;margin:.9em 0 0}

/* ---------- Interior ---------- */
/* Hoja de agradecimiento */
.thanks .th-title{font-family:'Great Vibes','Cormorant Garamond',Georgia,serif;font-weight:400;font-size:2.7em;line-height:1;color:var(--ink);margin:.1em 0 .45em;text-align:center;white-space:nowrap}
.thanks .th-sign .heart{margin-left:.2em}
.thanks .heart{font-family:'Lora',Georgia,serif;color:var(--cherry);font-size:.62em;vertical-align:.12em}
.thanks p{font-size:.94em;margin-bottom:.8em}
.thanks .th-quote{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:1.2em;line-height:1.35;color:#6E1F33;text-align:center;margin:.5em auto 0;max-width:20em;text-wrap:balance;padding-top:.8em;border-top:1px solid var(--hair)}
.thanks .th-sign{margin-top:auto;padding-top:.8em;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.1em}
.thanks .th-sign span:first-child{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.1em;color:var(--muted)}
.thanks .th-sign strong{font-family:'Great Vibes','Cormorant Garamond',Georgia,serif;font-weight:400;font-size:2.3em;line-height:1.1;color:var(--cherry)}
/* Sombra de bonsái detrás del texto (el dibujo se arma en JS) */
.bonsai{position:absolute;inset:0;pointer-events:none;background-image:var(--bonsai,none);background-repeat:no-repeat;background-size:var(--bonsai-size,auto 100%);opacity:.1}
.pg{position:absolute;inset:0;padding:8.5% 10% 12.5%;display:flex;flex-direction:column;color:var(--ink);font-size:1em}
.folio{position:absolute;bottom:4.6%;font-size:.74em;color:var(--muted);font-variant-numeric:tabular-nums}
.pg.l .folio{left:10%} .pg.r .folio{right:10%}

.d-num{font-size:.82em;color:var(--cherry);margin:0;font-weight:500}
.d-name{font-family:var(--serif);font-weight:400;font-size:3.25em;line-height:.95;margin:.2em 0 .6em;letter-spacing:-.012em;text-wrap:balance}
.d-desc{margin:0;line-height:1.58;max-width:26em;text-wrap:pretty}
.sym{font-family:'Lora',Georgia,serif;font-size:.86em;margin-right:.03em}
/* Título en dos letras (servicios) */
.d-name.script{margin:.35em 0 .45em;letter-spacing:0;line-height:1}
.d-name.script .s1{display:block;font-family:'Great Vibes','Cormorant Garamond',Georgia,serif;font-size:1.1em;line-height:.86;color:var(--ink)}
.d-name.script .s2{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:.52em;line-height:1.1;color:var(--cherry);padding-left:2em;margin-top:0}
.d-lead{margin:0 0 .8em;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:1.25em;line-height:1.3;color:#6E1F33;text-wrap:balance}
/* Página de servicio: texto y cuadro chico a la izquierda, fotos redondas a la derecha */
.svc-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1em}
.single .svc-body{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.svc-text{display:flex;flex-direction:column;min-width:0}
/* Servicio sin fotos: el texto usa todo el ancho y los datos van lado a lado */
.svc-body.solo{grid-template-columns:minmax(0,1fr)}
.svc-body.solo .mini{grid-template-columns:1fr 1fr;column-gap:1.5em}
.svc-body.solo .mini div:first-child{border-bottom:1px solid var(--hair)}
.svc-text .d-desc + .d-desc{margin-top:.7em}
.svc-text .d-desc{font-size:.94em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.mini{margin:auto 0 0;padding-top:1em;display:grid}
.mini div{padding:.5em 0;border-top:1px solid var(--hair)}
.mini div:last-child{border-bottom:1px solid var(--hair)}
.mini dt{font-size:.74em;color:var(--muted);margin-bottom:.2em}
.mini dd{margin:0;font-size:.95em}
.mini .price dd{font-family:var(--serif);font-size:1.7em;color:var(--cherry);line-height:1.05}
.photos{margin:0;min-height:0;position:relative;container-type:size}
.photos .ph{position:absolute;aspect-ratio:1;border-radius:50%;object-fit:cover;border:.3em solid #fff;box-shadow:0 12px 26px -12px rgba(60,8,26,.5),0 0 0 1px rgba(142,18,48,.1)}
/* Una foto abajo de la otra, lo más grandes que entren en la columna */
.photos .ph{--s:min(100cqw,47cqh);width:var(--s);left:50%;transform:translateX(-50%)}
.photos .ph1{top:calc(50% - var(--s) - .25em);object-position:50% 60%}
.photos .ph2{top:calc(50% + .25em);object-position:50% 50%}

.p-title{font-family:var(--serif);font-weight:400;font-size:2.6em;line-height:1;margin:0 0 .75em;letter-spacing:-.01em}
.prose p{line-height:1.62;margin:0 0 1em;max-width:27em;text-wrap:pretty;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.p-title.welcome{font-size:2.05em;line-height:1.1;text-wrap:balance}
/* Destello con contorno (mismo trazo fino que el corazón de la hoja final) */
.spark{display:inline-block;width:.62em;height:.6em;margin-right:.28em;vertical-align:.02em;fill:none;stroke:var(--cherry);stroke-width:1.7;stroke-linejoin:round;overflow:visible}
.spark.end{margin:0 0 0 -.05em}


/* Nombre de la página: invisible, solo para lectores de pantalla */
.where{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}

/* Botón de reserva en cada servicio */
.want{align-self:center;display:inline-block;margin:1.1em 0 0;padding:.55em 1.35em;border-radius:999px;background:var(--cherry);color:#FFF5F7;font-size:.86em;font-weight:500;line-height:1.2;text-decoration:none}
.want:hover{background:#A3183B}
.want[aria-disabled]{opacity:.6;pointer-events:none}
.want:focus-visible{outline:2px solid var(--cherry);outline-offset:3px}
</style>
</head>
<body>
<main class="desk">
  <div class="stage" id="stage">
    <div class="book no-anim" id="book" aria-roledescription="catálogo" aria-label="Catálogo de diseños">
      <div class="stack stack-l"></div>
      <div class="stack stack-r"></div>
      <div class="ribbon" aria-hidden="true"></div>
    </div>
  </div>
  <!-- Sin botones: las hojas se pasan con el dedo (o el mouse). Esto solo lo leen los lectores de pantalla -->
  <p class="where" id="where" aria-live="polite"></p>
</main>

<script src="datos.js"></script>
<script src="app.js"></script>
</body>
</html>
